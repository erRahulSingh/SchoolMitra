name: SchoolMitra Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ════════════ STAGE 1: LINT & BUILD VERIFICATION ════════════
  build-and-test:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & Verify Backend Server
        run: |
          cd server
          npm install
          npm run build --if-present

      - name: Build & Verify Parent App
        run: |
          cd apps/parent-app
          npm install
          npm run build

      - name: Build & Verify Driver App
        run: |
          cd apps/driver-app
          npm install
          npm run build

      - name: Build & Verify School Admin App
        run: |
          cd apps/school-admin
          npm install
          npm run build

      - name: Build & Verify Super Admin App
        run: |
          cd apps/super-admin
          npm install
          npm run build

      - name: Build & Verify Website
        run: |
          cd apps/website
          npm install
          npm run build

  # ════════════ STAGE 2: DOCKER CONTAINER BUILDS ════════════
  docker-build:
    name: Build & Tag Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config
