version: '3.8'

services:
  # ════════════ 1. UNIFIED EXPRESS & SOCKET.IO BACKEND ════════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: schoolmitra-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/schoolmitra}
      JWT_SECRET: ${JWT_SECRET:-schoolmitra_super_secret_jwt_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-schoolmitra_super_secret_refresh_key_2026}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ════════════ 2. SCHOOL ERP ADMIN APP (PORT 3000) ════════════
  school-admin:
    build:
      context: ./apps/school-admin
      dockerfile: Dockerfile
    container_name: schoolmitra-school-admin
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ════════════ 3. PARENT MOBILE PWA APP (PORT 3002) ════════════
  parent-app:
    build:
      context: ./apps/parent-app
      dockerfile: Dockerfile
    container_name: schoolmitra-parent-app
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000/api/v1
    ports:
      - "3002:3002"
    depends_on:
      - backend

  # ════════════ 4. DRIVER COCKPIT APP (PORT 3003) ════════════
  driver-app:
    build:
      context: ./apps/driver-app
      dockerfile: Dockerfile
    container_name: schoolmitra-driver-app
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000/api/v1
    ports:
      - "3003:3003"
    depends_on:
      - backend

  # ════════════ 5. SUPER ADMIN SAAS CONSOLE (PORT 3004) ════════════
  super-admin:
    build:
      context: ./apps/super-admin
      dockerfile: Dockerfile
    container_name: schoolmitra-super-admin
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000/api/v1
    ports:
      - "3004:3004"
    depends_on:
      - backend

  # ════════════ 6. PUBLIC MARKETING WEBSITE (PORT 3005) ════════════
  website:
    build:
      context: ./apps/website
      dockerfile: Dockerfile
    container_name: schoolmitra-website
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000/api/v1
    ports:
      - "3005:3005"
    depends_on:
      - backend

  # ════════════ 7. NGINX REVERSE PROXY & SSL GATEWAY ════════════
  nginx:
    image: nginx:alpine
    container_name: schoolmitra-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - school-admin
      - parent-app
      - driver-app
      - super-admin
      - website

networks:
  default:
    name: schoolmitra-network
